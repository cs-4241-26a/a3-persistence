<!doctype html>
<html lang='en'>
  <head>
    <title>Page Turner Reading List</title>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='Page Turner is a reading tracker for tracking books, reading time, and personal reading progress.'>
    <meta name='theme-color' content='#164b4b'>
    <meta property='og:title' content='Page Turner Reading List'>
    <meta property='og:description' content='Track your reading list, page counts, and time-to-finish goals in one place.'>
    <meta property='og:type' content='website'>
    <meta name='twitter:card' content='summary'>
    <link rel='preconnect' href='https://cdn.jsdelivr.net'>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link rel='stylesheet' href='css/main.css'>
    <script src='js/main.js' defer></script>
    <link rel='icon' href='data:;base64,iVBORw0KGgo='>
  </head>
  <body>
    <main class='container py-4'>
      <header class='mb-4'>
        <p class='eyebrow'>A small reading tracker</p>
        <h1>Page Turner</h1>
        <p>Keep a simple list of books and see how many days each one will take.</p>
      </header>

      <div id='user-badge' class='user-badge' aria-live='polite'>Not signed in</div>

      <section class='panel login-panel card shadow-sm border-0 mb-4' aria-labelledby='login-title'>
        <h2 id='login-title'>Account access</h2>
        <form id='login-form' class='login-form row g-3 align-items-end' novalidate>
          <label class='col-md-4'>Username <input class='form-control' id='username' name='username' type='text' autocomplete='username' required></label>
          <label class='col-md-4'>Password <input class='form-control' id='password' name='password' type='password' autocomplete='current-password' required></label>
          <div class='actions col-md-4'>
            <button type='submit' id='signin-button' value='login' class='btn btn-primary'>Sign in</button>
            <button type='submit' id='signup-button' value='signup' class='btn btn-outline-secondary'>Sign up</button>
            <button type='button' id='auth0-login-button' class='btn btn-outline-primary'>Continue with Auth0</button>
            <button type='button' id='logout-button' class='btn btn-outline-dark' hidden>Log out</button>
          </div>
        </form>
        <p id='login-message' role='status' aria-live='polite'></p>
      </section>

      <section class='panel card shadow-sm border-0' aria-labelledby='form-title'>
        <h2 id='form-title'>Add a book</h2>
        <form id='book-form' class='row g-3 align-items-end' novalidate>
          <input type='hidden' id='book-id'>
          <label class='col-md-3'>Title <input class='form-control' id='title' name='title' type='text' autocomplete='off' required></label>
          <label class='col-md-3'>Author <input class='form-control' id='author' name='author' type='text' autocomplete='off' required></label>
          <label class='col-md-2'>Pages <input class='form-control' id='pages' name='pages' type='number' min='1' required></label>
          <label class='col-md-2'>Minutes/day <input class='form-control' id='minutesPerDay' name='minutesPerDay' type='number' min='1' required></label>
          <div class='actions col-md-2'><button type='submit' id='save-button' class='btn btn-primary'>Add book</button><button type='button' id='cancel-button' class='btn btn-outline-secondary' hidden>Cancel</button></div>
        </form>
        <p id='message' role='status' aria-live='polite'></p>
      </section>

      <section aria-labelledby='results-title'>
        <div class='section-heading'>
          <h2 id='results-title'>Your reading list</h2>
          <span id='book-count'></span>
        </div>
        <div class='table-wrap'>
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Pages</th>
                <th>Minutes/day</th>
                <th>Reading time</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id='book-list'></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
