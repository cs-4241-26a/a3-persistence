<!doctype html>
<html lang='en'>
  <head>
    <title>Sign In Error - AgeSort</title>
    <meta charset='utf-8' />
    <meta name="description" content="Failure to Sign In.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel='stylesheet' href='css/main.css' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/favicon.ico?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>

    <main role="main">
      <div class="container text-center mt-4">
        <div class="box p-4">
          <h1>Sign in Error</h1>
            <p>
            Sign in Failed<br>
            Account does not exist, Password is incorrect, or you've <br>
            attempted to create an already existent account
            </p>
        </div>
      </div>
    </main>
    

     <div class="container text-center mt-4">
      <div class="box p-4">
        <form action="/signin_redirect" method="POST">
            <div class="d-flex justify-content-center align-items-center gap-3">
                <button type="submit" id="signin_redirect" class="btn btn-purple">Back to Sign In</button>
            </div>
        </form>
      </div>
    </div>

  </body>
</html>
