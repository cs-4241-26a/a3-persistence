<!doctype html>
<html lang='en'>
  <head>
    <meta charset='utf-8' />
    <title>CS4241 Assignment 2 : People Database</title>
    <script src='js/main.js'></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body class="bg-body-secondary">
    <h1 class="text-center mb-4">CS4241 Assignment 3 : Better People Database</h1>

    <div id="auth-section" class="text-center mb-4">
      <a id="login-link" href="/auth/github" class="btn btn-dark">Login with GitHub</a>

      <div id="logged-in-section" style="display: none;">
        <p class="mb-2">
          Logged in as <span id="username"></span>
        </p>

        <a href="/logout" class="btn btn-outline-danger">Logout</a>
      </div>
    </div>

    <main>
    <div id="app-section" class ="mx-auto" style="display: none;">
      <form id="person-form">
        <div class="mb-3">

                <label
                  for="firstname"
                  class="form-label"
                >
                  First Name:
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="firstname"
                  placeholder="First Name"
                  required
                />

              </div>

       <div class="mb-3">

                <label
                  for="lastname"
                  class="form-label"
                >
                  Last Name:
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="lastname"
                  placeholder="Last Name"
                  required
                />

              </div>

        <div class="mb-3">

                <label
                  for="age"
                  class="form-label"
                >
                  Age:
                </label>

                <input
                  type="number"
                  class="form-control"
                  id="age"
                  min="0"
                  max="100"
                  placeholder="Age"
                  required
                />

              </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
      </main>

      <div class="card shadow-sm">

          <div class="card-body">

            <h2 class="card-title mb-3">
              People Database
            </h2>

            <ul
              id="names"
              class="list-group"
            ></ul>

          </div>

        </div>
    </div>
  </body>
</html>
