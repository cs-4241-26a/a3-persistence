<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager - Log In</title>
  <meta name="description" content="Log in or create an account for the Bookmark Manager app." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
  <main class="container" style="max-width: 420px">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-1 text-center">Bookmark Manager</h1>
        <p class="text-center text-muted mb-4">Sign in to your account</p>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              autocomplete="username"
              required
              minlength="3"
            />
            <div class="invalid-feedback">Please enter a username (3+ characters).</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              minlength="6"
            />
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
          <div class="form-text mb-3">
            New here? Just enter a username and password &mdash; an account will be created for
            you automatically.
          </div>
          <button type="submit" class="btn btn-primary w-100">Log In / Sign Up</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
