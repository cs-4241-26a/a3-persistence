<!doctype html>
<html lang="en">
  <head>
    <title>Log In - Task Deadline Tracker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Log in or create an account to manage your personal task deadline tracker." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css" />

    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  </head>
  <body>

    <a class="visually-hidden-focusable skip-link" href="#login-form">Skip to login form</a>

    <header id="page-header" class="text-center">
      <h1>Task Deadline Tracker</h1>
      <p class="mb-0">Log in to see and manage your own tasks</p>
    </header>

    <main class="d-flex justify-content-center py-5 px-3">
      <div class="card shadow-sm login-card">
        <div class="card-body">
          <h2 class="card-title h4 mb-3">Log In</h2>
          <p class="text-muted small">
            No account yet? Enter a username and password you'll remember and an account will be automatically created
          </p>

          <div id="login-alert" class="alert d-none" role="alert" aria-live="polite"></div>

          <form id="login-form" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                autocomplete="username"
                aria-describedby="username-help"
                required>
              <div id="username-help" class="form-text">Letters and numbers, no spaces</div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="current-password"
                aria-describedby="password-help"
                minlength="4"
                required>
              <div id="password-help" class="form-text">At least 4 characters</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Log In / Create Account</button>
          </form>
        </div>
      </div>
    </main>

    <script src="js/login.js" defer></script>
  </body>
</html>
