<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <meta name="description" content="Manage your personal bookmarks: add, edit, and delete links." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand"><h1 class="h5 mb-0 d-inline">📑 Bookmark Manager</h1></span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light" id="welcomeText"></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <div class="row g-4">
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3" id="formTitle">Add a Bookmark</h2>
            <div id="itemAlert" class="alert d-none" role="alert"></div>
            <form id="itemForm" novalidate>
              <input type="hidden" id="itemId" value="" />

              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" required />
              </div>

              <div class="mb-3">
                <label for="url" class="form-label">URL</label>
                <input type="url" class="form-control" id="url" placeholder="https://example.com" required />
              </div>

              <fieldset class="mb-3">
                <legend class="form-label h6">Category</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="category" id="catWork" value="work" />
                  <label class="form-check-label" for="catWork">Work</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="category" id="catPersonal" value="personal" checked />
                  <label class="form-check-label" for="catPersonal">Personal</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="category" id="catLearning" value="learning" />
                  <label class="form-check-label" for="catLearning">Learning</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="category" id="catOther" value="other" />
                  <label class="form-check-label" for="catOther">Other</label>
                </div>
              </fieldset>

              <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" rows="3" placeholder="Optional notes"></textarea>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="favorite" />
                <label class="form-check-label" for="favorite">Mark as favorite</label>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" id="submitBtn">Add Bookmark</button>
                <button type="button" class="btn btn-outline-secondary d-none" id="cancelEditBtn">
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0">Your Bookmarks</h2>
          <div>
            <label for="filterSelect" class="visually-hidden">Filter by category</label>
            <select id="filterSelect" class="form-select form-select-sm" style="width: auto">
              <option value="all">All categories</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="learning">Learning</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div id="emptyState" class="text-muted d-none">
          You don't have any bookmarks yet. Add one using the form.
        </div>
        <div id="itemsList" class="d-flex flex-column gap-3"></div>
      </div>
    </div>
  </main>

  
  <template id="itemCardTemplate">
    <div class="card shadow-sm item-card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <h3 class="h6 mb-1 item-title"></h3>
          <span class="badge text-bg-secondary item-category"></span>
        </div>
        <a class="item-url d-block text-truncate mb-2" target="_blank" rel="noopener noreferrer"></a>
        <p class="item-notes text-muted small mb-2"></p>
        <div class="d-flex justify-content-between align-items-center">
          <span class="item-favorite small"></span>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-primary edit-btn">Edit</button>
            <button class="btn btn-outline-danger delete-btn">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="/js/app.js"></script>
</body>
</html>
