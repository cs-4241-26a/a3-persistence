<!doctype html>
<html lang='en'>
  <head>
    <title>Sign In - AgeSort</title>
    <meta charset='utf-8' />
    <meta name="description" content="Sign In page for AgeSort including form to insert username and password.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel='stylesheet' href='css/main.css' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/favicon.ico?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>

    <div class="container text-center mt-4">
      <div class="box p-4">
        <h1>Welcome to Age Sort</h1>
          <p>
          Sign In or Create Account
          </p>
      </div>
    </div>
    

    <main role="main">
      <div class="container mt-4">
        <div class="box2 p-4">

          <form action="/login" method='POST' id="signin_form">
            <fieldset>
              <div class="mb-3">
                <label for="username" class="form-label">Username *:</label>
                <input type="text" id="username" name="username" class="form-control" required/>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password *:</label>
                <input type="password" id="password" name="password" class="form-control" required/>
              </div>
              <div class="d-flex justify-content-center align-items-center gap-3">
                <button type="submit" formaction="/login" id="signin_button" class="btn btn-purple">Sign In</button>
                <button type="submit" formaction="/createAcct" id="create_button" class="btn btn-purple">Create Account</button>
              </div>
            </fieldset>
          </form>
        </div>
      
      </div>
  
    </main>
    

  </body>
</html>
