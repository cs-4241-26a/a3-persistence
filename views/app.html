<!doctype html>
<html lang="en">
  <head>
    <title>My Tasks — Task Deadline Tracker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="View, add, edit, and delete your personal tasks and their calculated deadlines." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css" />

    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  </head>
  <body>
    <a class="visually-hidden-focusable skip-link" href="#main-content">Skip to main content</a>
    <nav class="navbar navbar-dark" id="page-header" aria-label="Account">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Task Deadline Tracker</span>
        <div class="d-flex align-items-center gap-3">
          <span class="text-white small" id="welcome-text">Signed in</span>
          <button id="logout-button" class="btn btn-outline-light btn-sm" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <main id="main-content" class="container-fluid py-4 px-4">
      <div class="row g-4">
        <section class="col-12 col-lg-4" aria-labelledby="form-heading">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h2 id="form-heading" class="h4 card-title">Add a task</h2>

              <div id="form-alert" class="alert d-none" role="alert" aria-live="polite"></div>

              <form id="task-form" novalidate>
                <input type="hidden" id="edit-id" value="">

                <div class="mb-3">
                  <label for="task" class="form-label">Task name</label>
                  <textarea
                    class="form-control"
                    id="task"
                    name="task"
                    rows="2"
                    placeholder="e.g. Study for quiz"
                    required></textarea>
                </div>

                <fieldset class="mb-3">
                  <legend class="form-label h6">Priority</legend>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="priority" id="priority-high" value="high">
                    <label class="form-check-label" for="priority-high">High (deadline: +1 day)</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="priority" id="priority-medium" value="medium" checked>
                    <label class="form-check-label" for="priority-medium">Medium (deadline: +3 days)</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="priority" id="priority-low" value="low">
                    <label class="form-check-label" for="priority-low">Low (deadline: +7 days)</label>
                  </div>
                </fieldset>

                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" id="urgent-flag">
                  <label class="form-check-label" for="urgent-flag">
                    Mark as urgent (just adds a highlight — doesn't change the deadline)
                  </label>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" id="submit-button" class="btn btn-primary flex-grow-1">Add Task</button>
                  <button type="button" id="cancel-edit-button" class="btn btn-secondary d-none">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <section class="col-12 col-lg-8" aria-labelledby="results-heading">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h2 id="results-heading" class="h4 card-title">Your tasks</h2>
              <p class="text-muted small" id="task-count">Loading your tasks…</p>

              <div class="table-responsive">
                <table class="table table-hover align-middle" id="task-table">
                  <caption class="visually-hidden">List of your tasks with priority, created date, and deadline</caption>
                  <thead>
                    <tr>
                      <th scope="col">Task</th>
                      <th scope="col">Priority</th>
                      <th scope="col">Created</th>
                      <th scope="col">Deadline</th>
                      <th scope="col">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="task-table-body">
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>

      </div>
    </main>
    <script src="js/main.js" defer></script>
  </body>
</html>
