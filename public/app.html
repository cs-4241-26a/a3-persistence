<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 3</title>
    <meta charset='utf-8' />

    <meta name='viewport' content='width=device-width, initial-scale=1' />

    <meta name="description" content="Log in page to A Sticky Place. site for making sticky notes.">

    <script src='js/main.js' defer></script>

    <link rel='stylesheet' href='css/main.css' />
    <link rel="stylesheet" href="https://unpkg.com/papercss@1.9.2/dist/paper.min.css">

    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Shadow&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
  <main class="container" style="margin-top: 2rem;">

    <h1 class="text-center" style="font-family: 'Londrina Shadow', sans-serif; color: #DA4167; font-size: 80px;">A Sticky Place</h1>
    <div class="text-center">
      <a href="/logout" class="paper-btn btn-small" style="position: absolute; top:20px; right:20px;">Logout</a>
    </div>

    <div class="text-center margin-bottom">
      <!-- Using PaperCSS buttons -->
      <button id='addNote' class="paper-btn btn-secondary">Add Note</button>
    </div>

    <!-- container for notes -->
    <div class="row flex-center" id="notesContainer" style="gap: 20px;">
      <!-- notes render here -->
    </div>

  </main>

  <!-- The Modal -->
  <div id='noteModal' style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
    <!-- Using PaperCSS card for modal -->
    <div class='card' style="width: 90%; max-width: 500px; background: white;">
      <div class="card-body">
        <h2 class="card-title" style="font-size: 1.5rem">Note Details</h2>

        <form id='noteForm'>
          <div class="form-group">
            <label for="noteTitle" style="font-family: 'Montserrat', sans-serif; font-weight: bold;">Note Title</label>
            <input class="input-block" id='noteTitle' type='text' placeholder='e.g., Shopping List' required>
          </div>

          <div class="form-group">
            <label for="noteContent" style="font-family: 'Montserrat', sans-serif; font-weight: bold;">Note Details</label>
            <textarea class="input-block" id="noteContent" placeholder='loaf of milk, container of butter and a joe dirt dvd' required></textarea>
          </div>

          <div class="form-group">
            <label for="noteUrgency" style="font-family: 'Montserrat', sans-serif; font-weight: bold;">Urgency Level</label>
            <select class="input-block" id='noteUrgency' name='noteUrgency'>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>

          <div class="row flex-spaces" style="margin-top: 20px;">
            <button type='button' id='cancelNote' class="paper-btn btn-danger">Cancel</button>
            <button type="submit" id='saveNote' class='paper-btn btn-success'>Save Note</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  </body>
</html>
