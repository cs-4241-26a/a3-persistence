<!doctype html>
<html lang='en'>
  <head>
    <title>Expense Tracker</title>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src='js/main.js'></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='css/main.css' />
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Expense Tracker</h1>
        <button id="logout-btn" class="btn btn-outline-secondary">Log Out</button>
      </div>

      <form id="expense-form" class="row g-2 mb-4">
        <div class="col-sm-3">
          <input type="text" id="description" class="form-control" placeholder="Description" required>
        </div>
        <div class="col-sm-3">
          <input type="text" id="category" class="form-control" placeholder="Category" required>
        </div>
        <div class="col-sm-3">
          <input type="number" id="amount" class="form-control" placeholder="Amount" step="0.01" required>
        </div>
        <div class="col-sm-3">
          <button type="submit" class="btn btn-primary w-100">Add Expense</button>
        </div>
      </form>

      <table id="results" class="table table-striped">
        <thead>
          <tr>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Spend Level</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="results-body">
        </tbody>
      </table>
    </div>
  </body>
</html>
