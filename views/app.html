<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Record, edit, delete, and review your personal workout data.">

  <title>Workout Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">

  <script src="/js/main.js" defer></script>

  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>

<body class="bg-light">

  <header class="bg-dark text-white py-4">
    <div class="container d-flex justify-content-between align-items-center gap-3">
      <div>
        <h1 class="mb-1">Workout Tracker</h1>
        <p class="mb-0">Log your exercises and track your training volume.</p>
      </div>

      <a href="/logout" class="btn btn-outline-light">Log Out</a>
    </div>
  </header>

  <main class="container py-4">
    <div class="row g-4">

      <!-- Workout entry form -->
      <section class="col-lg-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h4 mb-3">Log an Exercise</h2>

            <form id="workout-form">
              <div class="mb-3">
                <label for="exercise" class="form-label">Exercise</label>
                <input
                  type="text"
                  id="exercise"
                  name="exercise"
                  class="form-control"
                  placeholder="Bench Press"
                  required
                >
              </div>

              <div class="mb-3">
                <label for="category" class="form-label">Exercise Type</label>

                <select id="category" name="category" class="form-select" required>
                  <option value="Chest">Chest</option>
                  <option value="Back">Back</option>
                  <option value="Legs">Legs</option>
                  <option value="Shoulders">Shoulders</option>
                  <option value="Arms">Arms</option>
                  <option value="Core">Core</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="sets" class="form-label">Sets</label>
                  <input
                    type="number"
                    id="sets"
                    name="sets"
                    class="form-control"
                    min="1"
                    required
                  >
                </div>

                <div class="col-md-6 mb-3">
                  <label for="reps" class="form-label">Reps</label>
                  <input
                    type="number"
                    id="reps"
                    name="reps"
                    class="form-control"
                    min="1"
                    required
                  >
                </div>
              </div>

              <div class="mb-3">
                <label for="weight" class="form-label">Weight</label>
                <input
                  type="number"
                  id="weight"
                  name="weight"
                  class="form-control"
                  min="0"
                  step="0.5"
                  required
                >
              </div>

              <fieldset class="mb-3">
                <legend class="form-label fs-6">Weight Unit</legend>

                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="unit"
                    id="unit-lb"
                    value="lb"
                    checked
                  >
                  <label class="form-check-label" for="unit-lb">Pounds</label>
                </div>

                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="unit"
                    id="unit-kg"
                    value="kg"
                  >
                  <label class="form-check-label" for="unit-kg">Kilograms</label>
                </div>
              </fieldset>

              <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea
                  id="notes"
                  name="notes"
                  class="form-control"
                  rows="3"
                  placeholder="Optional workout notes"
                ></textarea>
              </div>

              <button type="submit" id="submit-button" class="btn btn-primary w-100">
                Add Exercise
              </button>
            </form>
          </div>
        </div>
      </section>

      <!-- Workout results -->
      <section class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h4 mb-3">Workout Log</h2>

            <div id="empty-message" class="alert alert-secondary d-none">
              No workouts have been logged yet.
            </div>

            <div class="table-responsive">
              <table class="table table-striped table-hover align-middle">
                <thead>
                  <tr>
                    <th scope="col">Exercise</th>
                    <th scope="col">Type</th>
                    <th scope="col">Sets</th>
                    <th scope="col">Reps</th>
                    <th scope="col">Weight</th>
                    <th scope="col">Volume</th>
                    <th scope="col">Notes</th>
                    <th scope="col">Actions</th>
                  </tr>
                </thead>

                <tbody id="workout-results"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
