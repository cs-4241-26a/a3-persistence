<!doctype html>
<html lang='en'>
  <head>
    <title>Griffin's To-Do List</title>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <meta name='description' content='A simple to-do list that sorts your tasks into Open, In Progress, and Done.' />
    <script src='js/main.js' defer></script>
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' />
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <nav class='navbar bg-dark'>
      <div class='container'>
        <span class='navbar-brand text-white'>Griffin's To-Do List</span>
        <span class='text-white'>Logged in as <strong id='username'></strong> <a href='/logout' class='btn btn-outline-light btn-sm ms-2'>Log Out</a></span>
      </div>
    </nav>

    <main class='container py-4'>
      <h1>My Tasks</h1>
      <p>Add a task and move it by clicking the buttons.</p>

      <div id='welcome' class='alert alert-success' hidden>
        Welcome! We didn't find an account for you, so a new one was created with your GitHub username.
      </div>

      <!-- Where user adds new task -->
      <form id='addForm'>
        <div class='mb-3'>
          <label for='task' class='form-label'>Task</label>
          <input type='text' id='task' class='form-control' placeholder='What do you need to do?' required />
        </div>

        <div class='mb-3'>
          <label for='notes' class='form-label'>Notes</label>
          <textarea id='notes' class='form-control'></textarea>
        </div>

        <fieldset class='mb-3'>
          <legend class='fs-6'>Priority</legend>
          <div class='form-check form-check-inline'>
            <input type='radio' id='high' name='priority' value='high' class='form-check-input' />
            <label for='high' class='form-check-label'>High</label>
          </div>
          <div class='form-check form-check-inline'>
            <input type='radio' id='medium' name='priority' value='medium' class='form-check-input' />
            <label for='medium' class='form-check-label'>Medium</label>
          </div>
          <div class='form-check form-check-inline'>
            <input type='radio' id='low' name='priority' value='low' class='form-check-input' checked />
            <label for='low' class='form-check-label'>Low</label>
          </div>
        </fieldset>

        <div class='form-check mb-3'>
          <input type='checkbox' id='important' class='form-check-input' />
          <label for='important' class='form-check-label'>Important</label>
        </div>

        <button type='submit' id='submitButton' class='btn btn-success'>Add Task</button>
        <button type='reset' class='btn btn-outline-secondary'>Cancel</button>
      </form>

      <!-- Shows the only 3 items warning -->
      <p id='message' class='text-danger mt-3'></p>

      <!-- list constructions -->
      <div class='row g-3'>
        <section class='col-md-4'>
          <div class='card'>
            <h2 class='card-header h5'>Open</h2>
            <ul id='open' class='list-group list-group-flush'></ul>
          </div>
        </section>

        <section class='col-md-4'>
          <div class='card'>
            <h2 class='card-header h5'>In Progress (max 3)</h2>
            <ul id='closed' class='list-group list-group-flush'></ul>
          </div>
        </section>

        <section class='col-md-4'>
          <div class='card'>
            <h2 class='card-header h5'>Done</h2>
            <ul id='done' class='list-group list-group-flush'></ul>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
